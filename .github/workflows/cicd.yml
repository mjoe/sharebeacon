name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Unit tests
        run: swift test

      - name: Build universal release
        run: ./scripts/build-release.sh

      - name: Validate bundle
        run: |
          plutil -lint build/DerivedData/Build/Products/Release/ShareBeacon.app/Contents/Info.plist
          codesign --verify --deep --strict build/DerivedData/Build/Products/Release/ShareBeacon.app
          lipo -archs build/DerivedData/Build/Products/Release/ShareBeacon.app/Contents/MacOS/ShareBeacon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ShareBeacon
          path: |
            build/ShareBeacon-*.zip
            build/ShareBeacon-*.zip.sha256
