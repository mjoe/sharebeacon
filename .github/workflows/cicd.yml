name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 / Xcode 26
            runner: macos-26
          - name: macOS 27 / Xcode 27
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Unit tests
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project ShareBeacon.xcodeproj -scheme ShareBeacon -configuration Debug build

  release:
    name: Release bundle
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      # 0.10 sorts before 0.9 lexicographically, so a plain string compare would
      # happily let a release go backwards. Compare numerically instead. The
      # runner checks out the tag it is building, so that tag has to be excluded
      # or the new release would always tie with itself and refuse.
      - name: Ensure the release is newer than existing tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          current="${GITHUB_REF_NAME}"
          highest="$(
            git tag --list 'v*' |
              { grep -v -x -F "${current}" || true; } |
              sed 's/^v//' |
              sort -V |
              tail -n 1
          )"
          if [ -n "${highest}" ] && [ "$(printf '%s\n%s\n' "${highest}" "${version}" | sort -V | head -n 1)" = "${version}" ]; then
            printf 'Tag v%s is not newer than the existing v%s\n' "${version}" "${highest}" >&2
            exit 1
          fi
          printf 'v%s is newer than v%s\n' "${version}" "${highest:-none}"

      - name: Build universal release
        run: ./scripts/build-release.sh

      - name: Validate bundle
        run: |
          plutil -lint build/DerivedData/Build/Products/Release/ShareBeacon.app/Contents/Info.plist
          codesign --verify --deep --strict build/DerivedData/Build/Products/Release/ShareBeacon.app
          lipo -archs build/DerivedData/Build/Products/Release/ShareBeacon.app/Contents/MacOS/ShareBeacon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ShareBeacon
          path: |
            build/ShareBeacon-*.zip
            build/ShareBeacon-*.zip.sha256
